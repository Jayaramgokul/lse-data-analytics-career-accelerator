name: examples

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt
      - name: Run every Python example, project by project
        run: |
          for p in 2market-marketing-analysis nhs-service-demand turtle-games; do
            cd "$p/examples"
            for f in 0*.py; do echo "== $p/$f"; python "$f"; done
            cd ../..
          done

  r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - run: Rscript -e 'install.packages(c("dplyr", "ggplot2", "car", "lmtest", "Metrics"))'
      - name: Run the R examples (Turtle Games)
        working-directory: turtle-games/examples
        run: for f in 0*.R; do echo "== $f"; Rscript "$f"; done
